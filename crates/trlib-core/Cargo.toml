[package]
name = "trlib-core"
description = "Runtime-independent, zero-copy MTProto 2.0 and TL core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["service", "transport-abridged", "transport-intermediate"]
std = []
service = []
transport-abridged = []
transport-intermediate = []
crypto-rustcrypto = ["dep:aes", "dep:sha2", "dep:subtle", "dep:zeroize"]
# Selected Telegram API method bindings and zero-copy result views.  This is
# deliberately separate from the transport-only core so an update gateway does
# not pay for client-side request code.
api = []
# Phone-code login request/response helpers from the selected API schema.
auth = ["api"]
# Encrypted, line-oriented session document codec.  It is no_std and uses the
# same small AES/SHA-256 primitives as the MTProto session crypto backend.
session-document = ["crypto-rustcrypto"]
# File-system convenience helpers around `session-document`; applications that
# have their own storage can use the no_std codec instead.
session-file = ["session-document", "std"]
# A small TDLib-shaped command/event adapter.  It is intentionally optional so
# native TRLib deployments do not link JSON compatibility code or file I/O.
tdlib-compat = ["std", "api", "auth", "session-file"]

[dependencies]
aes = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
alloc_instead_of_core = "deny"
clone_on_ref_ptr = "deny"
missing_safety_doc = "deny"
std_instead_of_core = "deny"
