[workspace]
members = [
    "crates/trlib-core",
    "tools/size-probe",
    "tools/tg-test-dc",
    "tools/tl-prefix-gen",
    "tools/trlib-build",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/tdd761914-arch/TRLib"

[workspace.dependencies]
aes = { version = "0.8.4", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.8.2", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.bench]
inherits = "release"
