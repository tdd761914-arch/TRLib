# Compile-time profile for a small update gateway.
package = trlib-core
release = true
std = false
service = true
transport_abridged = false
transport_intermediate = true
crypto_rustcrypto = false
api = false
auth = false
session_document = false
session_file = false
# Set true only for the TDLib-shaped migration adapter. It also enables its
# API/auth/session dependencies and requires std.
tdlib_compat = false
