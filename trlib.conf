# Compile-time profile for a small update gateway.
package = trlib-core
release = true
std = false
service = true
transport_abridged = false
transport_intermediate = true
crypto_rustcrypto = false
# no_std RSA/DH auth-key handshake; does not enable std
auth_key = false
api = false
# Per-schema-namespace toggles.  They default to the `api` key; set a namespace
# to false to drop e.g. payments.* from the build entirely, or set `api = false`
# and enable only the namespaces you need.  The full list mirrors the vendored
# telegram_api.tl: account aicompose auth bots channels chatlists communities
# contacts ephemeral folders fragment help langpack messages payments phone
# photos premium smsjobs stats stickers storage stories updates upload users.
# api_account = true
# api_payments = false
auth = false
session_document = false
session_file = false
