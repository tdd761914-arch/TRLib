[package]
name = "size-probe"
description = "Tiny TRLib parser throughput and binary-size probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["transport-intermediate"]
transport-intermediate = ["trlib-core/transport-intermediate"]
crypto-rustcrypto = ["trlib-core/crypto-rustcrypto"]
api = ["trlib-core/api"]
auth = ["trlib-core/auth"]
session-document = ["trlib-core/session-document"]

[dependencies]
trlib-core = { path = "../../crates/trlib-core", default-features = false }
